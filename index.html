<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APR Velocity Scanner Pro</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
            --border: #334155;
            --blue: #3b82f6;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }

        .header-area { text-align: center; margin-bottom: 1.5rem; }
        
        .input-group { display: grid; gap: 16px; margin-bottom: 1.5rem; }
        
        label { 
            display: block; 
            font-size: 0.85rem; 
            color: var(--text-secondary); 
            font-weight: 500; 
            margin-bottom: 6px; 
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .helper-link {
            font-size: 0.75rem;
            color: var(--blue);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .helper-link:hover { text-decoration: underline; opacity: 0.8; }

        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background-color: #2563eb; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { background-color: var(--border); cursor: not-allowed; }

        .results-section { 
            margin-top: 2rem; 
            display: none; 
            max-height: 520px; 
            overflow-y: auto;
            padding-right: 8px;
        }

        .results-section::-webkit-scrollbar { width: 6px; }
        .results-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .section-label { 
            font-size: 0.75rem; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 12px; 
            position: sticky; 
            top: 0; 
            background: var(--bg-card); 
            padding: 5px 0;
            z-index: 10;
        }

        .sprint-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 35px 1fr auto;
            align-items: center;
            transition: all 0.2s;
        }

        .sprint-card:hover { 
            background: rgba(16, 185, 129, 0.06); 
            border-color: var(--accent);
            transform: scale(1.01);
        }

        .rank { font-weight: 800; color: var(--text-secondary); font-size: 0.85rem; }
        .sprint-info p { margin: 2px 0; }
        
        .apr-badge {
            background: var(--accent);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            text-align: center;
            min-width: 85px;
            line-height: 1.2;
        }

        .date-range { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
        .duration { font-size: 0.8rem; color: var(--text-secondary); }
        
        #error { color: var(--danger); font-size: 0.85rem; margin-top: 1rem; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h2 style="margin:0 0 5px 0;">APR Velocity Scanner</h2>
        <p style="color: var(--text-secondary); margin: 0; font-size: 0.9rem;">Ranked Top 10 Explosive Moves</p>
    </div>
    
    <div class="input-group">
        <div class="grid-2">
            <div><label>Ticker</label><input type="text" id="ticker" placeholder="TSLA"></div>
            <div>
                <div class="label-row">
                    <label>API Key</label>
                    <a href="https://polygon.io/dashboard/api-keys" target="_blank" class="helper-link">Get Key</a>
                </div>
                <input type="password" id="polygon_key" placeholder="Key">
            </div>
        </div>
        <div class="grid-2">
            <div><label>Start Date</label><input type="date" id="start"></div>
            <div><label>End Date</label><input type="date" id="end"></div>
        </div>
    </div>

    <button id="goBtn" onclick="fetchAndAnalyze()">Run Deep Scan</button>
    <div id="error"></div>

    <div id="results" class="results-section">
        <div class="section-label">Top 10 Maximum Effective APR Sprints</div>
        <div id="sprintList"></div>
    </div>
</div>

<script>
// Initialization
const today = new Date().toISOString().split('T')[0];
const ninetyAgo = new Date(Date.now() - 90*24*60*60*1000).toISOString().split('T')[0];
document.getElementById('start').value = ninetyAgo;
document.getElementById('end').value = today;

const savedKey = localStorage.getItem('polygon_persistent_key');
if (savedKey) document.getElementById('polygon_key').value = savedKey;

function calcAPR(gainPct, days) {
    if (days <= 0) return 0;
    // ( (1 + gain)^ (365/days) - 1 )
    return (Math.pow(1 + (gainPct/100), 365/days) - 1) * 100;
}

const formatDate = (ts) => new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });

async function fetchAndAnalyze() {
    const ticker = document.getElementById('ticker').value.trim().toUpperCase();
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;
    const apiKey = document.getElementById('polygon_key').value.trim();
    const errEl = document.getElementById('error');
    const resultsArea = document.getElementById('results');
    const sprintList = document.getElementById('sprintList');
    const btn = document.getElementById('goBtn');

    if (!ticker || !apiKey) {
        errEl.textContent = "Please provide both Ticker and API Key.";
        errEl.style.display = "block";
        return;
    }

    localStorage.setItem('polygon_persistent_key', apiKey);
    errEl.style.display = "none";
    btn.textContent = 'Scanning Data...';
    btn.disabled = true;

    try {
        const url = `https://api.polygon.io/v2/aggs/ticker/${ticker}/range/1/day/${start}/${end}?adjusted=true&sort=asc&apiKey=${apiKey}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.results) throw new Error(data.error || "No historical data found.");

        const prices = data.results;
        let allPossibleTrades = [];

        // Generate all unique combinations of start/end dates
        for (let i = 0; i < prices.length; i++) {
            for (let j = i + 1; j < prices.length; j++) {
                const entryPrice = prices[i].c;
                const exitPrice = prices[j].c;
                const gainPct = ((exitPrice - entryPrice) / entryPrice) * 100;
                
                // Only care about gains
                if (gainPct <= 0) continue;

                const msDiff = prices[j].t - prices[i].t;
                const days = Math.max(1, Math.round(msDiff / 86400000));
                
                const apr = calcAPR(gainPct, days);
                
                allPossibleTrades.push({
                    entryDate: prices[i].t,
                    exitDate: prices[j].t,
                    entryP: entryPrice,
                    exitP: exitPrice,
                    gain: gainPct,
                    days: days,
                    apr: apr
                });
            }
        }

        // Sort by highest APR first
        allPossibleTrades.sort((a, b) => b.apr - a.apr);

        // Filter for Non-Overlapping Windows
        let uniqueSprints = [];
        for (let trade of allPossibleTrades) {
            const isOverlap = uniqueSprints.some(s => 
                (trade.entryDate < s.exitDate && trade.exitDate > s.entryDate)
            );
            if (!isOverlap) uniqueSprints.push(trade);
            if (uniqueSprints.length >= 10) break;
        }

        sprintList.innerHTML = '';
        uniqueSprints.forEach((s, index) => {
            const aprDisplay = s.apr > 1000000 ? '>1M' : Math.round(s.apr).toLocaleString();
            sprintList.innerHTML += `
                <div class="sprint-card">
                    <div class="rank">#${index + 1}</div>
                    <div class="sprint-info">
                        <p class="date-range">${formatDate(s.entryDate)} → ${formatDate(s.exitDate)}</p>
                        <p class="duration">${s.days} day window • $${s.entryP.toFixed(2)} to $${s.exitP.toFixed(2)}</p>
                        <p style="color:var(--accent); font-weight:bold; font-size:0.85rem;">+${s.gain.toFixed(2)}% Total Gain</p>
                    </div>
                    <div class="apr-badge">${aprDisplay}%<br><span style="font-size:0.6rem; opacity:0.9; font-weight:400;">EST. APR</span></div>
                </div>
            `;
        });

        resultsArea.style.display = 'block';

    } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
    } finally {
        btn.textContent = 'Run Deep Scan';
        btn.disabled = false;
    }
}
</script>
</body>
</html>
